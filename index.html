<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cbc7bd" />
    <meta
      name="description"
      content="Combif1am — agentic full-stack engineer, product and CX, plane spotting, and mixed media."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Combif1am" />
    <meta property="og:title" content="Combif1am" />
    <meta property="og:description" content="A handwritten portfolio by Srihari Raman." />
    <meta property="og:url" content="https://combif1am.site/" />
    <meta property="og:image" content="https://combif1am.site/assets/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="The handwritten Combif1am portfolio displayed on a neutral background." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Combif1am" />
    <meta name="twitter:description" content="A handwritten portfolio by Srihari Raman." />
    <meta name="twitter:image" content="https://combif1am.site/assets/share-card.jpg" />
    <meta name="twitter:image:alt" content="The handwritten Combif1am portfolio displayed on a neutral background." />
    <link rel="canonical" href="https://combif1am.site/" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Combif1am</title>
    <script>
      (() => {
        const theme = "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#242529" : "#cbc7bd";
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --surface-light: #dedbd3;
        --surface-mid: #cbc7bd;
        --surface-dark: #b7b2a7;
        --viewport-height: 100vh;
        --page-base: var(--surface-mid);
        --page-background:
          radial-gradient(
            circle at 50% 34%,
            rgba(255, 255, 255, 0.46) 0,
            rgba(255, 255, 255, 0.12) 42%,
            transparent 68%
          ),
          linear-gradient(
            145deg,
            var(--surface-dark),
            var(--surface-mid) 44%,
            var(--surface-light)
          );
      }

      @supports (height: 100svh) {
        :root {
          --viewport-height: 100svh;
        }
      }

      @supports (height: 100dvh) {
        :root {
          --viewport-height: 100dvh;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        cursor: url("assets/cursor.svg") 4 5, default;
      }

      html {
        background-color: var(--page-base);
        background-image: var(--page-background);
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
      }

      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: var(--viewport-height);
        overflow-x: clip;
        overflow-y: auto;
        background: transparent;
        isolation: isolate;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        opacity: 0.18;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }

      .controls {
        position: relative;
        z-index: 2;
        display: flex;
        min-height: calc(54px + env(safe-area-inset-top));
        align-items: center;
        justify-content: flex-end;
        padding:
          calc(8px + env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          0
          max(16px, env(safe-area-inset-left));
      }

      .theme-toggle {
        display: grid;
        width: 38px;
        height: 38px;
        padding: 0;
        place-items: center;
        border: 0;
        color: #24211d;
        background: transparent;
        cursor: url("assets/cursor-click.svg") 9 10, pointer;
        transition:
          color 180ms ease,
          background 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
      }

      .theme-toggle:hover {
        transform: rotate(-8deg) scale(1.06);
      }

      .theme-toggle:focus-visible {
        outline: 3px solid rgba(29, 67, 162, 0.72);
        outline-offset: 3px;
      }

      .theme-toggle svg {
        width: 18px;
        height: 18px;
      }

      .theme-toggle .sun {
        display: none;
      }

      main {
        display: grid;
        min-height: 0;
        place-items: center;
        padding: 0 clamp(8px, 1.5vmin, 20px) clamp(8px, 1.5vmin, 20px);
      }

      .folio {
        position: relative;
        width: min(96vw, calc((100vh - 104px) * 3197 / 4380));
        width: min(
          calc(
            100vw - max(16px, env(safe-area-inset-left)) - max(16px, env(safe-area-inset-right))
          ),
          max(
            120px,
            calc(
              (
                  var(--viewport-height) - 104px - env(safe-area-inset-top) -
                    env(safe-area-inset-bottom)
                ) * 3197 / 4380
            )
          )
        );
        aspect-ratio: 3197 / 4380;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .folio::after {
        content: "";
        position: absolute;
        z-index: 1;
        inset: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .folio img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: opacity 220ms ease;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      .paper-dark {
        opacity: 0;
      }

      .link {
        position: absolute;
        z-index: 2;
        top: 90.8%;
        height: 6.3%;
        border-radius: 0.35rem;
        color: transparent;
        outline: 0;
        cursor: url("assets/cursor-click.svg") 9 10, pointer;
        -webkit-tap-highlight-color: transparent;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body {
        cursor: url("assets/cursor-dark.svg") 4 5, default;
      }

      html[data-theme="dark"] {
        --page-base: #202125;
        --page-background:
          radial-gradient(
            circle at 50% 36%,
            rgba(92, 93, 97, 0.58) 0,
            rgba(62, 63, 67, 0.24) 43%,
            transparent 72%
          ),
          linear-gradient(145deg, #303135, #202125 52%, #38393d);
      }

      html[data-theme="dark"] body::before {
        opacity: 0.24;
        mix-blend-mode: soft-light;
      }

      html[data-theme="dark"] .paper-light {
        opacity: 0;
      }

      html[data-theme="dark"] .paper-dark {
        opacity: 1;
        filter:
          drop-shadow(0 2px 2px rgba(0, 0, 0, 0.48))
          drop-shadow(0 18px 28px rgba(0, 0, 0, 0.42));
      }

      html[data-theme="dark"] .link,
      html[data-theme="dark"] .theme-toggle {
        cursor: url("assets/cursor-click-dark.svg") 9 10, pointer;
      }

      html[data-theme="dark"] .theme-toggle {
        color: #f5f0e7;
        background: transparent;
      }

      html[data-theme="dark"] .theme-toggle .moon {
        display: none;
      }

      html[data-theme="dark"] .theme-toggle .sun {
        display: block;
      }

      html[data-theme="dark"] .link:focus-visible {
        outline-color: rgba(247, 220, 115, 0.9);
      }

      .link:focus-visible {
        outline: 3px solid rgba(29, 67, 162, 0.72);
        outline-offset: -3px;
        background: rgba(255, 255, 255, 0.1);
      }

      .github {
        left: 5.5%;
        width: 16.2%;
      }

      .twitter {
        left: 26%;
        width: 17.7%;
      }

      .email {
        left: 43.8%;
        width: 17.1%;
      }

      .credit {
        min-height: 30px;
        margin: 0;
        padding:
          2px
          max(12px, env(safe-area-inset-right))
          max(7px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        color: rgba(35, 31, 27, 0.42);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: clamp(7px, 0.7vw, 9px);
        line-height: 1.35;
        letter-spacing: 0.005em;
      }

      html[data-theme="dark"] .credit {
        color: rgba(245, 240, 231, 0.38);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-contrast: more) {
        .link:focus-visible {
          outline-color: #001a5c;
          background: rgba(255, 255, 255, 0.3);
        }
      }
    </style>
  </head>
  <body>
    <header class="controls">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.985 12.486A9 9 0 1 1 11.514 3.015c.37-.02.554.435.33.73a6 6 0 0 0 8.411 8.411c.295-.224.75-.04.73.33Z"/>
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </button>
    </header>
    <main>
      <h1 class="sr-only">Combif1am</h1>
      <div class="folio">
        <img
          class="paper-light"
          src="assets/paper.webp"
          alt="A handwritten portfolio page for Combif1am."
          width="3197"
          height="4380"
          draggable="false"
        />
        <img
          class="paper-dark"
          src="assets/paper-dark.webp"
          alt="A black-and-white version of the handwritten portfolio page for Combif1am."
          width="3197"
          height="4380"
          draggable="false"
        />
        <a
          class="link github"
          href="https://github.com/Srihar1-raman"
          aria-label="GitHub — Srihar1-raman"
        >GitHub</a>
        <a
          class="link twitter"
          href="https://x.com/combif1am"
          aria-label="X, formerly Twitter — combif1am"
        >Twitter / X</a>
        <a
          class="link email"
          href="mailto:srihari22work@gmail.com"
          aria-label="Email srihari22work@gmail.com"
        >Email</a>
      </div>
    </main>
    <p class="credit">
      Inspired by a paper portfolio I once saw online, if you know the original, lmk please.
    </p>
    <script>
      (() => {
        const root = document.documentElement;
        const button = document.querySelector(".theme-toggle");
        const themeColor = document.querySelector('meta[name="theme-color"]');

        const syncButton = () => {
          const dark = root.dataset.theme === "dark";
          const label = `Switch to ${dark ? "light" : "dark"} theme`;
          button.setAttribute("aria-label", label);
          button.title = label;
          themeColor.content = dark ? "#242529" : "#cbc7bd";
        };

        button.addEventListener("click", () => {
          const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = nextTheme;
          root.style.colorScheme = nextTheme;
          syncButton();
        });

        syncButton();
      })();
    </script>
  </body>
</html>
